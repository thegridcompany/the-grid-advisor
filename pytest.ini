# pytest.ini
[pytest]
# Directories to search for tests, relative to the project root
testpaths = tests app

# Python file naming convention for test discovery
python_files = test_*.py tests_*.py *_test.py *_tests.py

# Python class naming convention for test discovery (if using classes)
python_classes = Test* *Tests

# Python function naming convention for test discovery
python_functions = test_* *_test

# Add default command line options
# For example, to always run with verbose output and show captured stdout:
# addopts = -ra -vv --capture=no
addopts = --cov=. --cov-report=html --cov-report=term-missing --cov-report=json --no-cov-on-fail

# Configure coverage paths (optional, --cov=. covers current dir and subdirs)
# cov_paths = app/

# Minimum coverage percentage
cov_fail_under = 85

# Files/directories to omit from coverage
cov_omit = 
    */tests/*
    */venv/*
    */__init__.py
    */conftest.py
    */app/main.py  # Often difficult to fully cover, consider excluding or specific tests
    */app/core/config.py # Settings file, might not need coverage

# Ignore warnings (use with caution)
# filterwarnings =
#    ignore::DeprecationWarning

# Environment variables for tests (if needed)
# env =
#    MY_ENV_VAR = my_value 