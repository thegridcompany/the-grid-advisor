version: '3.8'

services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./.env.test:/app/.env
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=test
      - TESTING=true
    depends_on:
      - redis
    networks:
      - test-network
    command: >
      sh -c "
        echo 'Waiting for services to be ready...' &&
        sleep 5 &&
        echo 'Running tests...' &&
        pytest -v --tb=short --color=yes
      "

  redis:
    image: redis:7-alpine
    networks:
      - test-network
    ports:
      - "6379:6379"

networks:
  test-network:
    driver: bridge